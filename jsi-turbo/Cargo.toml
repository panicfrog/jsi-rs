[package]
name = "jsi-turbo"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "MIT"
description = "Rust TurboModule framework for React Native (Rust macros as the spec source)"
publish = false

[dependencies]
# default-features = false: React Native apps already ship jsi, and this
# crate is RN-specific anyway (the dispatcher uses jsi-rn's CallInvoker)
jsi = { path = "../jsi", default-features = false, features = ["macros", "serde"] }
jsi-rn = { path = "../jsi-rn" }
jsi-turbo-macros = { path = "../jsi-turbo-macros" }
linkme = "0.3"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
