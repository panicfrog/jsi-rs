[package]
name = "jsi-rn"
version = "0.88.1"
edition = "2021"
rust-version = "1.74"
links = "jsi-rn"
license = "MIT"
description = "React Native integration for jsi-rs: CallInvoker and runtime setup"
authors = ["yongping.ye <burnedfrog@163.com>"]
repository = "https://github.com/panicfrog/jsi-rs/"

exclude = [
  "vendor/hermes"
]

[dependencies]
jsi = { path = "../jsi", version = "0.88.1" }
cxx = "1.0"
anyhow = "1.0"
log = { version = "0.4", optional = true }

[build-dependencies]
cxx-build = "1.0"
dunce = "1.0"

[features]
call-invoker-trace = ["log"]
