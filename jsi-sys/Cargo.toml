[package]
name = "jsi-sys"
version = "0.88.1"
edition = "2021"
rust-version = "1.74"
links = "jsi"
license = "MIT"
description = "Low-level, engine-agnostic bindings to JSI (the JavaScript Interface used by Hermes, JSC and React Native)"
authors = ["yongping.ye <burnedfrog@163.com>"]
repository = "https://github.com/panicfrog/jsi-rs/"

exclude = [
  "vendor/hermes"
]

[dependencies]
cxx = "1.0"
anyhow = "1.0"

[build-dependencies]
cxx-build = "1.0"
dunce = "1.0"

[features]
default = ["bundled-jsi"]
# compile jsi.cpp into this crate; disable when the host (e.g. a React Native
# app) already provides the jsi symbols
bundled-jsi = []
