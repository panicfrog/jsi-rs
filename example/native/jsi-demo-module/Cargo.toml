[package]
name = "jsi-demo-module"
version = "0.88.1"
edition = "2021"
license = "MIT"
publish = false

[lib]
# linked into the per-app aggregate library (example/native/rust-app), which
# is what iOS/Android actually consume
crate-type = ["lib"]

[dependencies]
# React Native already ships jsi, so don't compile a second copy of it
jsi = { path = "../../../jsi", default-features = false, features = ["macros", "serde"] }
jsi-turbo = { path = "../../../jsi-turbo" }
linkme = "0.3"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
