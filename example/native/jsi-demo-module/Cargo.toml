[package]
name = "jsi-demo-module"
version = "0.88.1"
edition = "2021"
license = "MIT"
publish = false

[lib]
# linked into the per-app aggregate library (example/native/rust-app), which
# is what iOS/Android actually consume
crate-type = ["lib"]

[dependencies]
# The framework crates always come from the core npm package's rust/ dir
# (a sibling in node_modules) — ONE copy in the cargo graph; the build
# hook syncs it from the jsi-rs checkout in dev, registry installs ship it
jsi = { path = "../../node_modules/react-native-rust-turbo/rust/jsi", default-features = false, features = ["macros", "serde"] }
jsi-turbo = { path = "../../node_modules/react-native-rust-turbo/rust/jsi-turbo" }
linkme = "0.3"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
