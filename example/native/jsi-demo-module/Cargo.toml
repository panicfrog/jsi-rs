[package]
name = "jsi-demo-module"
version = "0.88.1"
edition = "2021"
license = "MIT"
publish = false

[lib]
# both platforms link the static library into the app's native build, where
# React Native's jsi resolves the jsi symbols
crate-type = ["staticlib"]

[dependencies]
# React Native already ships jsi, so don't compile a second copy of it
jsi = { path = "../../../jsi", default-features = false, features = ["macros", "serde"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
