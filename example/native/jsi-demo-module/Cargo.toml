[package]
name = "jsi-demo-module"
version = "0.88.1"
edition = "2021"
license = "MIT"
publish = false

[lib]
# linked into the per-app aggregate library (example/native/rust-app), which
# is what iOS/Android actually consume
crate-type = ["lib"]

[dependencies]
jsi = { path = "../../../jsi" }
jsi-turbo = { path = "../../../jsi-turbo" }
linkme = "0.3"
anyhow = "1.0"
cxx = "1.0"
serde = { version = "1.0", features = ["derive"] }
