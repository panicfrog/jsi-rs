[package]
name = "jsi-demo-module"
version = "0.88.1"
edition = "2021"
license = "MIT"
publish = false

[lib]
# iOS consumes the staticlib, Android consumes the cdylib
crate-type = ["staticlib", "cdylib"]

[dependencies]
jsi = { path = "../../../jsi" }
anyhow = "1.0"
cxx = "1.0"
serde = { version = "1.0", features = ["derive"] }
