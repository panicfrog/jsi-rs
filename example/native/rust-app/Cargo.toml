[package]
name = "rust-app"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# The per-app aggregate library: both iOS and Android link the staticlib
# (the platform linker pulls in the archive members the glue references,
# which also keeps the cxx bridge's C++ side alive). Every Rust TurboModule
# crate this app uses must be a dependency of this crate (and appear in
# FORCE_LINK below).
[lib]
crate-type = ["staticlib"]

[dependencies]
jsi = { path = "../../../jsi" }
jsi-sys = { path = "../../../jsi-sys" }
jsi-turbo = { path = "../../../jsi-turbo" }
jsi-demo-module = { path = "../jsi-demo-module" }
anyhow = "1.0"
cxx = "1.0"

[build-dependencies]
cxx-build = "1.0"
