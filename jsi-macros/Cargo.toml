[package]
name = "jsi-macros"
version = "0.77.3"
edition = "2021"
rust-version = "1.74"
license = "MIT"
description = "Support macros for jsi-rs"
authors = ["Ibiyemi Abiodun <ibiyemi@intulon.com>"]
repository = "https://github.com/laptou/jsi-rs/"

[lib]
proc-macro = true

[dependencies]
heck = "0.5"
proc-macro-error2 = "2"
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2", features = ["full", "quote"] }

[features]
host-object-trace = []
