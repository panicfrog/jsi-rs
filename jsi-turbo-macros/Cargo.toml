[package]
name = "jsi-turbo-macros"
version = "0.88.2"
edition = "2021"
rust-version = "1.74"
license = "MIT"
description = "Proc macros for jsi-turbo"
publish = false

[lib]
proc-macro = true

[dependencies]
heck = "0.5"
proc-macro-error2 = "2"
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2", features = ["full", "quote"] }
