[package]
name = "jsi"
version = "0.88.1"
edition = "2021"
rust-version = "1.74"
license = "MIT"
description = "Write React Native JSI modules in Rust"
authors = ["yongping.ye <burnedfrog@163.com>"]
repository = "https://github.com/panicfrog/jsi-rs/"

[dependencies]
jsi-sys = { path = "../jsi-sys", version = "0.88.1", default-features = false }
jsi-macros = { path = "../jsi-macros", version = "0.88.1", optional = true }
cxx = "1.0"
anyhow = "1.0"
log = { version = "0.4", optional = true }
better_any = "0.2"
serde = { version = "1.0", optional = true }
thiserror = "2"

[features]
default = ["bundled-jsi", "macros", "serde"]
# compile jsi.cpp into the Rust library; disable when the host (e.g. a React
# Native app) already provides the jsi symbols
bundled-jsi = ["jsi-sys/bundled-jsi"]
host-object-trace = ["log"]
host-fn-trace = ["log"]
js-fn-trace = ["log"]
macros = ["jsi-macros"]
serde = ["dep:serde"]
