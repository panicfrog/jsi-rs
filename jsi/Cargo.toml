[package]
name = "jsi"
version = "0.77.3"
edition = "2021"
rust-version = "1.74"
license = "MIT"
description = "Write React Native JSI modules in Rust"
authors = ["Ibiyemi Abiodun <ibiyemi@intulon.com>"]
repository = "https://github.com/laptou/jsi-rs/"

[dependencies]
jsi-sys = { path = "../jsi-sys", version = "0.77.3" }
jsi-macros = { path = "../jsi-macros", version = "0.77.3", optional = true }
cxx = "1.0"
anyhow = "1.0"
log = { version = "0.4", optional = true }
better_any = "0.2"
serde = { version = "1.0", optional = true }
thiserror = "2"

[features]
default = ["macros", "serde"]
host-object-trace = ["log"]
host-fn-trace = ["log"]
js-fn-trace = ["log"]
call-invoker-trace = ["log"]
macros = ["jsi-macros"]
serde = ["dep:serde"]
